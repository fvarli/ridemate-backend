# ─────────────────────────────────────────────────────────────
# RideMate API — the contract.
#
# THIS FILE IS THE SOURCE OF TRUTH, not a description of the code.
#
# It is hand-authored and never generated from controllers. Generation would
# invert the relationship: the code would lead and the contract would follow,
# so an implementation detail could change what RideMate promises without
# anyone reviewing a diff. The client repository is separate and develops
# against this file, not against Laravel.
#
# Synchronisation is enforced by tests, not by discipline. Every documented
# response is validated against the schema below in tests/Contract, so drift
# is a failing build rather than a review comment.
#
# It documents ONLY what the service actually serves today. Writing a future
# endpoint here would be the same class of untruth as a button claiming
# something happened — and the contract tests could not validate it.
# ─────────────────────────────────────────────────────────────

openapi: 3.1.0

info:
  title: RideMate API
  version: 0.1.0
  summary: Journey sharing and cost sharing for Istanbul.
  description: |
    RideMate connects people whose journeys are already compatible. A driver is
    making the trip regardless; the product finds passengers going the same way
    and lets them share the journey's legitimate costs.

    It is not taxi, ride-hailing, chauffeur or commercial passenger transport,
    and the contract reflects that: there is no fare, no price, no earnings and
    no payout anywhere in it, now or later. A test enforces that vocabulary
    against this file.

    The versioned product API at `/api/v1` carries authentication: a member
    proves possession of a phone number with a one-time passcode and receives a
    short-lived access token plus a rotating refresh token.

    Everything else the product will eventually offer — routes, seat requests,
    trips, reviews, safety — is deliberately absent. This document describes
    what the service serves, not what it intends to.

servers:
  - url: http://localhost:8000
    description: Local development

tags:
  - name: Operations
    description: Liveness and readiness probes. Not part of the versioned product API.
  - name: Authentication
    description: |
      Proving possession of a phone number, and exchanging that proof for
      credentials. There is no password anywhere in RideMate, so there is
      nothing to hash, leak or reset.
  - name: Account
    description: The signed-in member's own record. Never another member's.
  - name: Routes
    description: |
      Publishing a journey, and the places one can run between. A route is a
      plan a driver states, not a booking anyone has made.

paths:
  /health:
    get:
      operationId: getHealth
      tags: [Operations]
      summary: Liveness
      description: |
        Reports that the process is alive. **Touches no dependency**, so a
        database outage must never affect it — otherwise an orchestrator would
        restart a healthy process because something else broke, turning one
        outage into two.
      responses:
        '200':
          description: The process is alive.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /ready:
    get:
      operationId: getReady
      tags: [Operations]
      summary: Readiness
      description: |
        Reports whether every dependency needed to serve traffic is available.

        PostGIS is a hard dependency rather than a nice-to-have: route matching
        is geographic, so a database without it cannot serve RideMate even
        though it accepts connections.

        The response names which check failed and never why. A readiness probe
        is reachable by anything that can reach the service, so it must not
        publish a host, a port, a DSN, a driver message or a SQL fragment. The
        reason lives in the log line for the request.
      responses:
        '200':
          description: Every dependency is ready.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: At least one dependency is unavailable.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'

  /api/v1/auth/otp:
    post:
      operationId: requestPasscode
      tags: [Authentication]
      summary: Request a one-time passcode
      security: []
      description: |
        Sends a passcode to the given number.

        **The response never reveals whether an account exists.** It is `202`
        with the same body in every case, because the alternative turns this
        endpoint into a membership oracle: anyone could learn who uses RideMate
        by submitting numbers and reading the difference. Nothing on the server
        side even looks — an account is resolved only when a passcode is
        verified, so there is no branch here that could differ.

        For the same reason the body carries no challenge identifier, no expiry,
        no resend timestamp and no hint about previous requests. A caller
        learns only that the request was accepted for delivery.

        `202` rather than `200`: delivery is handed to an SMS provider and is
        not complete when this returns.

        Rate limited per number and per address. The two limits are
        indistinguishable in the response, so the count cannot be probed either.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequest'
      responses:
        '202':
          description: Accepted for delivery. Says nothing about the number.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpAccepted'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/otp/verify:
    post:
      operationId: verifyPasscode
      tags: [Authentication]
      summary: Exchange a passcode for credentials
      security: []
      description: |
        Verifies the passcode and returns a token pair.

        **This is both registration and sign-in.** A first-time member and a
        returning one take the same path: if no account exists for the verified
        number, one is created. RideMate has no separate register endpoint,
        because having one would mean the request itself announced which case
        applied.

        Every failure — no outstanding passcode, expired, already used,
        attempts exhausted, wrong code — is the same `401`. A caller cannot
        tell how close a guess was, or whether a passcode was ever issued.

        A suspended account is `403`, and nothing is created or issued.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
      responses:
        '200':
          description: Verified. The session is open.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/auth/refresh:
    post:
      operationId: refreshCredentials
      tags: [Authentication]
      summary: Exchange a refresh token for a new pair
      security: []
      description: |
        Returns a new pair and invalidates the one presented.

        **The refresh token travels in the body, not in `Authorization`.** It is
        not a bearer credential for this API: it authorises exactly one action,
        and putting it in the header invites clients to attach it to ordinary
        requests, where it would spread through logs and proxies that were only
        ever meant to see a short-lived token.

        **Rotation is strict and single-use.** Presenting a refresh token that
        has already been exchanged is treated as theft and revokes the whole
        session — every access token and every refresh token issued to that
        device. The server cannot distinguish a stolen credential from a client
        that retried a request whose response it never received, and resolves
        that ambiguity in favour of security. Clients must therefore ensure only
        one refresh is in flight at a time.

        Unknown token, wrong secret, expired token, already-rotated token and
        revoked session are **all the same `401`**. The distinction exists in
        the server's records and never in the response, because publishing it
        would tell an attacker holding a stolen credential exactly what happened
        to it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Rotated. The previous pair is now invalid.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/auth/logout:
    post:
      operationId: signOut
      tags: [Authentication]
      summary: End this session
      security:
        - bearerAuth: []
      description: |
        Revokes the session behind the presented access token.

        Takes effect immediately for **both** credentials: the access token
        stops working before its own expiry, and the refresh token can no
        longer be exchanged. Other devices are untouched — each has its own
        session.

        Idempotent. Signing out of a session that has already ended is still
        `204`.
      responses:
        '204':
          description: The session is over.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/v1/me:
    get:
      operationId: getMe
      tags: [Account]
      summary: The signed-in member's account
      security:
        - bearerAuth: []
      description: |
        Returns the caller's own account and nothing else.

        Deliberately narrow. There is no profile, no verification state, no
        Trust Score, no session list and no device list — not because they are
        omitted for brevity, but because RideMate does not have them yet, and a
        contract that described them would be describing an intention.

        The response is an object wrapping `account` rather than the account
        itself, so those concepts can be added later without breaking a client.
      responses:
        '200':
          description: The caller's account.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/me/profile:
    get:
      operationId: getMyProfile
      tags: [Profile]
      summary: The signed-in member's public identity
      security:
        - bearerAuth: []
      description: |
        The member's own profile: what they are called, and the initials drawn
        from it.

        Separate from `/api/v1/me`, which returns a credential. That one carries
        a phone number and a sign-in status and is shown to nobody; this one
        carries what another member will eventually see. Keeping them apart is
        what stops a phone number travelling with a name.

        Deliberately two fields. There is no public profile id, because nothing
        needs one — a member is reached through their own credential, and a
        published route names its owner by their profile rather than by a
        handle. There is no avatar, bio, rating, trip count, verification state
        or Trust Score: RideMate has none of them, and a contract describing
        them would be describing an intention.

        `initials` is derived from `display_name` on every read rather than
        stored, so the two cannot disagree. A client must render what it is
        given and must not compute its own.
      responses:
        '200':
          description: The caller's profile.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: saveMyProfile
      tags: [Profile]
      summary: Set the signed-in member's public identity
      security:
        - bearerAuth: []
      description: |
        Names the state the profile should be in, rather than a change to apply,
        which is why this is a PUT and why it carries no `Idempotency-Key`.
        Sending the same body twice leaves the same profile with the same name,
        so a retry over a dropped connection is safe by the shape of the
        operation — tier 2 of the idempotency policy in docs/api-conventions.md.

        `201` when the profile did not exist and this request created it, `200`
        when it did and this request rewrote it. The distinction is real: a
        client that has just created its profile leaves setup, and one that
        renamed does not.

        Two first-time writes arriving together still produce one profile. The
        request that lost the race reports `200`, because by the time it wrote,
        the profile genuinely already existed.

        The owner comes from the credential. There is no field naming an
        account, and unknown fields are refused rather than ignored — including
        `initials`, which the server derives and a client may not set.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
      responses:
        '200':
          description: The profile existed and now says this.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileEnvelope'
        '201':
          description: The profile did not exist and was created.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/places:
    get:
      operationId: listPlaces
      tags: [Routes]
      summary: The places a pilot journey can start or end at
      security:
        - bearerAuth: []
      description: |
        The curated catalogue a driver picks endpoints from.

        Reference data, not user content: a member does not create a place.
        RideMate publishes a small set of real meeting points — ferry terminals,
        metro stations, a shopping centre entrance — and the coordinates behind
        them stay on the server.

        **Only `id` and `label` are returned.** The catalogue also holds
        latitude, longitude and a spatial point, and none of them appear here.
        They exist so a later phase can match corridors; they are not the
        client's business, and publishing them would hand every member a
        location dataset to answer a question the client never asks.

        Deliberately not paginated. This is a bounded catalogue, not a feed —
        it is short by design, and a cursor over five rows would be ceremony.
        The first paginated response is `/api/v1/me/routes`.
      responses:
        '200':
          description: Every place a journey may use.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceCatalogue'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/routes:
    post:
      operationId: publishRoute
      tags: [Routes]
      summary: Publish a journey
      security:
        - bearerAuth: []
      description: |
        Publishes a journey the caller is driving.

        **The client supplies the id, and that is what makes this safe to
        retry.** It generates a UUIDv7 before sending, so a request repeated
        over a dropped connection carries the same id and cannot become a second
        journey. There is no `Idempotency-Key` header: the primary key already
        answers the question one would ask.

        - **201** — the journey was created by this request.
        - **200** — this exact journey already existed under this id. The first
          attempt landed; nothing is written again, not even a timestamp.
        - **409** — the id is already in use for something else. The response
          says only that. It never reveals whose it is or what it describes.

        The driver is the authenticated member. There is no owner field in the
        request, because a request that could name one could publish a journey
        in somebody else's name.

        `timezone` is absent from the request for the same class of reason. The
        server records the pilot's zone, and a client that could choose one
        could decide for itself whether its own departure had passed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoutePublication'
      responses:
        '201':
          description: The journey was published.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteEnvelope'
        '200':
          description: |
            This journey was already published under this id. The body is
            identical to the one the original request returned.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/me/routes:
    get:
      operationId: listMyRoutes
      tags: [Routes]
      summary: The journeys the caller has published
      security:
        - bearerAuth: []
      description: |
        The caller's own routes, newest first, including cancelled ones.

        Scoped to the authenticated member by the query itself; there is no
        parameter that could widen it.

        **Cursor pagination, not offset.** A member's list grows while they read
        it, and an offset over a moving list shows some rows twice and skips
        others — a correctness problem that is invisible when testing against
        fixed data.

        The cursor is **opaque**. It is produced by this endpoint and passed back
        unchanged; it is not a date, an id, an index or anything a client should
        construct, parse or reason about. What it encodes is an implementation
        detail that must be free to change.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of the caller's routes.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutePage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/routes/{routeId}/cancel:
    post:
      operationId: cancelRoute
      tags: [Routes]
      summary: Cancel a published journey
      security:
        - bearerAuth: []
      description: |
        Withdraws a journey the caller published.

        **Naturally idempotent, and therefore has no request body.** The
        transition names the state it wants, so running it twice is not a second
        cancellation — it is the same one, observed again.

        - **200** — cancelled, or already cancelled. The body is the same
          either way, and a repeat does not move `cancelled_at`.
        - **409** — the journey is a one-off whose departure has already passed.
          Cancelling it would rewrite history rather than change a plan.
        - **404** — the route is not the caller's. A member cannot learn that
          somebody else's route exists by trying to cancel it.

        There is no `expected_status` field. That convention is for transitions
        with several valid starting states; this one has a single target and
        re-running it changes nothing.
      parameters:
        - $ref: '#/components/parameters/RouteId'
      responses:
        '200':
          description: The journey is cancelled.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        The access token from `POST /api/v1/auth/otp/verify` or
        `POST /api/v1/auth/refresh`, sent as `Authorization: Bearer <token>`.

        Opaque. It is a lookup key, not a container: clients must not parse it,
        split it, or infer anything from its shape, and none of its structure
        is contract. Short-lived by design — when it expires, exchange the
        refresh token rather than asking the member to sign in again.

        **The refresh token is not a bearer credential** and must never be sent
        in this header. It goes in the body of the refresh request only. See
        that operation for why.

  responses:
    Unauthenticated:
      description: |
        The credential is missing, malformed, unknown, expired, already used, or
        belongs to a session that has ended.

        Which of those it was is deliberately not stated. A caller holding a
        credential that stopped working learns only that it stopped working.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: |
        The credential is genuine and the account may not act.

        Distinct from `401` on purpose: a client must be able to tell "sign in
        again" from "your account is suspended", because retrying the first
        advice forever is the only thing a member could otherwise do.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationFailed:
      description: The request body is not usable. Field detail is in `details`.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: |
        The resource does not exist, or does not exist for this caller.

        Deliberately one answer for both. Telling a member that somebody else's
        route exists — merely by refusing it differently — would leak the very
        thing the refusal was protecting.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: |
        The request cannot be applied to the current state.

        Either an id already means something else, or a transition was asked
        for that the resource's state does not allow. The body never describes
        the resource that caused the conflict.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: |
        Too many attempts. Applies per number and per address; the response does
        not say which, so neither count can be probed.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: |
        Something failed on the server. For passcode requests this includes a
        delivery failure: the passcode was recorded but could not be handed to
        a provider, so a retry is subject to the usual cooldown.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  parameters:
    RouteId:
      name: routeId
      in: path
      required: true
      description: |
        The route's identifier, as the client generated it when publishing.
      schema:
        $ref: '#/components/schemas/RouteId'

    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        A position in the caller's list, taken verbatim from a previous
        response's `next_cursor`.

        **Opaque.** It is not a date, an id, an offset or a page number, and a
        client must never construct, parse or modify one. What it encodes is an
        implementation detail that has to stay free to change; a client that
        read it would be depending on the ordering of a query it cannot see.

        Omit it to start at the newest route.
      schema:
        type: string
        minLength: 1
        maxLength: 512

    Limit:
      name: limit
      in: query
      required: false
      description: |
        How many routes to return. The server may return fewer; only an absent
        `next_cursor` means the end has been reached.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20

  headers:
    RequestId:
      description: |
        The correlation id for this request, echoed on every response. If the
        caller supplies a well-formed UUID it is honoured, so a retry can be
        correlated with its original attempt; anything else is replaced.

        This is a transport concern and never a domain identifier.
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, service, environment, release]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
          description: The application name.
        environment:
          type: string
          description: The runtime environment, for example `local` or `production`.
        release:
          type: string
          description: The deployed build identifier. Never describes infrastructure.

    Readiness:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          type: object
          additionalProperties: false
          required: [database, postgis]
          properties:
            database:
              $ref: '#/components/schemas/CheckResult'
            postgis:
              $ref: '#/components/schemas/CheckResult'

    CheckResult:
      type: string
      enum: [ok, failed]
      description: Whether the dependency answered. Never says why it did not.

    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              description: |
                **Developer-facing English. Clients must never display it.**

                The RideMate client owns its own localized copy with Turkish as
                the source language. Server-authored display text would fork
                message ownership across two repositories and two release
                cadences. Map `code` to a client string instead.

                Fixed wording for `not_found` and `method_not_allowed` in
                every environment, and for `internal_error` outside a debug
                build. Framework text for those cases echoes the requested
                path, enumerates the verbs a route accepts, or names an
                internal class and record id — none of which a caller can act
                on, and all of which describe the service to whoever is
                probing it.

                Never contains anything the caller supplied.
            details:
              type: object
              description: |
                Field-level failures. Present only for validation errors;
                absent everywhere else, so its presence is meaningful.
              additionalProperties:
                type: array
                items:
                  type: string
            request_id:
              type: string
              format: uuid
              description: Matches the `X-Request-Id` response header.

    ErrorCode:
      type: string
      description: |
        The stable machine contract. Clients map these to their own localized
        copy, so renaming one is a breaking contract change.
      enum:
        - bad_request
        - unauthenticated
        - forbidden
        - not_found
        - method_not_allowed
        - conflict
        - validation_failed
        - rate_limited
        - internal_error

    OtpRequest:
      type: object
      additionalProperties: false
      required: [phone]
      properties:
        phone:
          type: string
          minLength: 4
          maxLength: 32
          description: |
            The number as the member would write it. `0532 123 45 67`,
            `+90 532 123 45 67` and `905321234567` are the same person and are
            normalized to one canonical E.164 identity server-side.

            A number in full international form is honoured whatever its
            country; the Türkiye default applies only when no country code is
            given.
          examples:
            - '0532 123 45 67'

    OtpAccepted:
      type: object
      additionalProperties: false
      required: [status]
      description: |
        The entire body. It is this small on purpose: anything varying by
        number — a challenge id, an expiry, a resend time — would leak what the
        `202` exists to hide.
      properties:
        status:
          type: string
          enum: [accepted]

    OtpVerifyRequest:
      type: object
      additionalProperties: false
      required: [phone, code]
      properties:
        phone:
          type: string
          minLength: 4
          maxLength: 32
          description: The same number the passcode was requested for.
          examples:
            - '0532 123 45 67'
        code:
          type: string
          pattern: '^[0-9]{6}$'
          description: |
            The passcode from the message.

            The example is a fixed placeholder and is not a value this service
            would ever issue by preference.
          examples:
            - '000000'
        device_name:
          type: string
          maxLength: 64
          description: |
            Shown back to the member when they review their sessions, and to
            nobody else. Client-supplied and never trusted: nothing authorises
            on it.
          examples:
            - 'Pixel 8'
        platform:
          type: string
          maxLength: 32
          description: Display metadata only. Not trusted, not authorised on.
          examples:
            - 'android'
        app_version:
          type: string
          maxLength: 32
          description: Display metadata only. Not trusted, not authorised on.
          examples:
            - '1.0.0'

    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          description: The refresh token from the most recent pair.
          examples:
            - 'rmr_00000000-0000-7000-8000-000000000000.EXAMPLE-REFRESH-TOKEN-NOT-A-REAL-CREDENTIAL'

    TokenPair:
      type: object
      additionalProperties: false
      required: [access_token, refresh_token, token_type, expires_in, session_id]
      description: |
        What every successful authentication returns, whether it came from a
        passcode or from a rotation.

        It carries no token identifier, no generation number and nothing else
        about how credentials are stored. Those are the server's bookkeeping;
        publishing them would make an implementation detail into a promise, and
        would hand an attacker a map of the token chain.
      properties:
        access_token:
          type: string
          description: |
            Send as `Authorization: Bearer <token>`. Opaque — do not parse.
          examples:
            - 'rma_00000000-0000-7000-8000-000000000000.EXAMPLE-ACCESS-TOKEN-NOT-A-REAL-CREDENTIAL'
        refresh_token:
          type: string
          description: |
            Single use. Exchanging it returns a new pair and invalidates this
            one; presenting it twice ends the session. Store it where the
            platform keeps secrets, never beside ordinary preferences.
          examples:
            - 'rmr_00000000-0000-7000-8000-000000000000.EXAMPLE-REFRESH-TOKEN-NOT-A-REAL-CREDENTIAL'
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          minimum: 1
          description: |
            Seconds until the ACCESS token expires. Says nothing about the
            refresh token or the session, both of which outlive it.
          examples:
            - 900
        session_id:
          type: string
          format: uuid
          description: |
            Identifies this device's session, so a member can be told which one
            ended. Not a credential and not accepted as one.
          examples:
            - '00000000-0000-7000-8000-000000000001'

    ProfileEnvelope:
      type: object
      additionalProperties: false
      required: [profile]
      properties:
        profile:
          $ref: '#/components/schemas/Profile'

    Profile:
      type: object
      additionalProperties: false
      required: [display_name, initials]
      description: |
        A member's public identity, and the whole of it.

        What is absent is absent on purpose. There is no id — Phase 11 publishes
        no public profile identifier — and no `account_id`, which is internal and
        would tie a public representation to a credential. No `created_at` or
        `updated_at`: those record when a row was touched, which is a fact about
        the database rather than about the member, and publishing one means
        supporting it afterwards.
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 80
          description: |
            As the member typed it, with surrounding whitespace removed. Stored
            and returned in exactly that form, so what they see is what was
            kept.
          examples:
            - 'İrem Yılmaz'
        initials:
          type: string
          minLength: 1
          maxLength: 8
          description: |
            Derived from `display_name` by the server: the first character of
            the only token, or the first characters of the first and last when
            there is more than one. Uppercased with Turkish casing, so `irem`
            gives `İ` rather than `I`.

            Never stored and never accepted from a client. A client renders this
            value and does not compute its own — two implementations of the rule
            would eventually disagree about a member's name.
          examples:
            - 'İY'

    ProfileUpdate:
      type: object
      additionalProperties: false
      required: [display_name]
      description: |
        The one thing a member supplies. `initials` is derived and is refused
        here like any other unknown field; an owner is taken from the credential
        and can never be named in a body.
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 80
          examples:
            - 'İrem Yılmaz'

    Me:
      type: object
      additionalProperties: false
      required: [account]
      properties:
        account:
          $ref: '#/components/schemas/Account'

    Account:
      type: object
      additionalProperties: false
      required: [id, phone_e164, phone_verified_at, status, created_at]
      description: |
        Credential identity, not a profile. Nothing here is shown to another
        member, and `phone_e164` in particular never appears in any response
        other than the owner's own.
      properties:
        id:
          type: string
          format: uuid
          examples:
            - '00000000-0000-7000-8000-000000000002'
        phone_e164:
          type: string
          description: Canonical E.164, which is the only form stored.
          examples:
            - '+905321234567'
        phone_verified_at:
          type: string
          format: date-time
          description: |
            When possession of this number was proven. Kept separate from
            `created_at`, which they coincide with today but would not once a
            number can be changed.
        status:
          $ref: '#/components/schemas/AccountStatus'
        created_at:
          type: string
          format: date-time

    RouteId:
      type: string
      format: uuid
      pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
      description: |
        A UUID **version 7**, generated by the client before it publishes.

        The version is part of the contract, not a preference. v7 is
        time-ordered, so ids append to an index instead of scattering across it,
        and `format: uuid` alone would accept a v4 — which is why the pattern
        pins the version nibble and the variant as well.

        This id is also what makes publishing safe to retry: the same id is the
        same journey, so a repeated request cannot create a second one.
      examples:
        - 01991b00-0000-7000-8000-0000000000a1

    PlaceId:
      type: string
      format: uuid
      description: The identifier of a place from `GET /api/v1/places`.
      examples:
        - 01991a00-0000-7000-8000-000000000001

    Place:
      type: object
      additionalProperties: false
      required: [id, label]
      description: |
        A place a journey can start or end at, as the client needs it.

        Exactly two fields. The catalogue behind this also stores latitude,
        longitude and a spatial point, and none of them belong on the wire: the
        client selects places by identity and renders them by name, and it has
        never needed to know where they are.
      properties:
        id:
          $ref: '#/components/schemas/PlaceId'
        label:
          type: string
          description: The name shown to the member, in Turkish.
          examples:
            - Kadıköy, Vapur İskelesi

    PlaceCatalogue:
      type: object
      additionalProperties: false
      required: [places]
      description: |
        The whole catalogue. An object rather than a bare array, so a later
        phase can add something alongside it without breaking a client.
      properties:
        places:
          type: array
          items:
            $ref: '#/components/schemas/Place'

    Recurrence:
      type: string
      enum: [once, weekdays]
      description: |
        How often the journey happens.

        `once` states a date. `weekdays` repeats until cancelled and has no
        single date, which is why it must not carry one.

        There is no arbitrary recurrence rule, no day picker and no end date:
        the approved screen offers these two, and inventing more would be a
        scheduling model no driver asked for.

    RideRules:
      type: object
      additionalProperties: false
      required: [no_smoking, music_ok, no_pets, quiet]
      description: |
        What the driver says about their own car.

        Preferences stated by a person, not conditions anyone enforces and not
        filters anything matches on. They are carried because the screen
        collects them, and publishing a journey while discarding them would
        leave four controls that appear to do something and do not.
      properties:
        no_smoking:
          type: boolean
        music_ok:
          type: boolean
        no_pets:
          type: boolean
          description: |
            POLICY REVIEW OUTSTANDING. Carried as the driver's own statement.
            Before this is ever used to filter or match, it needs product,
            legal and safety review. Recording that here keeps the question
            attached to the field rather than losing it.
        quiet:
          type: boolean

    RoutePublication:
      type: object
      additionalProperties: false
      required:
        - id
        - origin_place_id
        - destination_place_id
        - recurrence
        - departure_time
        - seats_offered
        - rules
      description: |
        A journey to publish.

        Note what is absent. There is no owner: the driver is the authenticated
        member, and a field naming one could publish in somebody else's name.
        There is no timezone: the server records the pilot's, and a client that
        chose its own could decide for itself whether its departure had passed.
        There is no cost of any kind: RideMate shares journey costs and charges
        nobody, and no driver chooses the figure the screen suggests.
      properties:
        id:
          $ref: '#/components/schemas/RouteId'
        origin_place_id:
          $ref: '#/components/schemas/PlaceId'
        destination_place_id:
          $ref: '#/components/schemas/PlaceId'
        recurrence:
          $ref: '#/components/schemas/Recurrence'
        departure_date:
          $ref: '#/components/schemas/DepartureDate'
        departure_time:
          $ref: '#/components/schemas/DepartureTime'
        seats_offered:
          $ref: '#/components/schemas/SeatsOffered'
        rules:
          $ref: '#/components/schemas/RideRules'
      oneOf:
        - title: A one-off journey, which states its date
          properties:
            recurrence:
              enum: [once]
          required: [departure_date]
        - title: A weekday commute, which has no single date
          properties:
            recurrence:
              enum: [weekdays]
          not:
            required: [departure_date]

    DepartureDate:
      type: string
      format: date
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
      description: |
        The calendar day a one-off journey happens, read in the route's
        timezone. Present only when `recurrence` is `once`.

        A real date, checked as one: `2026-02-30` is refused rather than
        quietly read as the 2nd of March.
      examples:
        - '2026-09-14'

    DepartureTime:
      type: string
      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
      description: |
        The wall clock the driver chose, `HH:mm`, read in the route's timezone.

        **Minutes only.** Deliberately not `format: time`, which would imply
        the RFC 3339 shape and suggest that `08:00:00` is accepted; the server
        rejects it, and a contract that hinted otherwise would be lying to
        whoever wrote the client.

        A wall clock rather than an instant, because a weekday commute has no
        single instant to state.
      examples:
        - '08:25'

    SeatsOffered:
      type: integer
      minimum: 1
      maximum: 32767
      description: |
        Free seats the driver is offering.

        The minimum is the product rule: a journey with no free seat is not
        being shared. **The maximum is a storage bound, not a policy** — it is
        the capacity of the column, stated so that an absurd value is a clean
        rejection rather than a server error. RideMate has no vehicle model and
        therefore no opinion about how many seats a car has; when one exists,
        the real limit will come from it.
      examples:
        - 3

    DepartureState:
      type: string
      enum: [upcoming, past]
      description: |
        Whether the departure is still ahead, derived when you ask.

        Never stored and never writable. A one-off journey becomes `past` by
        the clock moving, not by anything being updated, which is why there is
        no `expired` status and nothing sweeping for one. A recurring journey is
        always `upcoming` while published: there is always another weekday.

        The server derives it because the rule lives in the route's timezone. A
        client recomputing it would eventually disagree about whether a journey
        can still be cancelled.

    RouteStatus:
      type: string
      enum: [published, cancelled]
      description: |
        Two states, because Phase 10 has behaviour for two. A journey that has
        already departed is not a third state — see `departure_state`.

    Route:
      type: object
      additionalProperties: false
      required:
        - id
        - origin
        - destination
        - recurrence
        - departure_time
        - timezone
        - departure_state
        - seats_offered
        - rules
        - status
        - published_at
      description: |
        A published journey.

        Everything here is something RideMate actually knows: where the journey
        runs, when it leaves, how many seats are free, what the driver said
        about their car, and whether it still stands.

        Nothing here describes the driver. No name, no rating, no verification
        badge, no trip count, no trust score, no vehicle and no cost — not
        omitted for brevity, but absent because RideMate does not have them, and
        a field carrying a plausible number would make the rest of a screen look
        equally real.
      properties:
        id:
          $ref: '#/components/schemas/RouteId'
        origin:
          $ref: '#/components/schemas/Place'
        destination:
          $ref: '#/components/schemas/Place'
        recurrence:
          $ref: '#/components/schemas/Recurrence'
        departure_date:
          description: |
            The day a one-off journey happens. `null` for a weekday commute,
            which has no single date.
          oneOf:
            - $ref: '#/components/schemas/DepartureDate'
            - type: 'null'
        departure_time:
          $ref: '#/components/schemas/DepartureTime'
        timezone:
          type: string
          description: |
            The IANA zone the departure is read in, recorded when the journey
            was published. Server-owned: it never appears in a request.
          examples:
            - Europe/Istanbul
        departure_state:
          $ref: '#/components/schemas/DepartureState'
        seats_offered:
          $ref: '#/components/schemas/SeatsOffered'
        rules:
          $ref: '#/components/schemas/RideRules'
        status:
          $ref: '#/components/schemas/RouteStatus'
        published_at:
          type: string
          format: date-time
        cancelled_at:
          description: When the journey was withdrawn; `null` while it stands.
          oneOf:
            - type: string
              format: date-time
            - type: 'null'

    RouteEnvelope:
      type: object
      additionalProperties: false
      required: [route]
      description: |
        One route, wrapped, so something can be added beside it later without
        breaking a client.
      properties:
        route:
          $ref: '#/components/schemas/Route'

    RoutePage:
      type: object
      additionalProperties: false
      required: [routes, next_cursor]
      description: |
        A page of routes, newest first.
      properties:
        routes:
          type: array
          items:
            $ref: '#/components/schemas/Route'
        next_cursor:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 512
            - type: 'null'
          description: |
            Pass this back as `cursor` to continue. **`null` means the end** —
            an empty `routes` array does not, and a client that stopped on one
            would sometimes stop early.

            Opaque: see the `cursor` parameter.
          examples:
            - null

    AccountStatus:
      type: string
      enum: [active, suspended]
      description: |
        Two states, because two have behaviour. `suspended` is refused at
        passcode verification, at refresh and at every authenticated request.
        Deletion and deactivation are not modelled until something produces and
        consumes them.
